name: portability
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install R dependency
        run: Rscript -e 'install.packages("data.table", repos="https://cloud.r-project.org")'
      - name: bash/zsh environment check
        run: sh tests/test_shells.sh
      - name: Syntax-check every shell script
        run: for f in scripts/*.sh run_local.sh slurm/*.sh slurm/*.slurm; do bash -n "$f"; done
      - name: REML self-test
        run: Rscript tests/test_reml.R
